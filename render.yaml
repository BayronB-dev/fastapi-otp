# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: auth-otp-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Un solo worker: SQLite y el rate limiter en memoria no se comparten entre procesos.
    startCommand: gunicorn app.main:app -k uvicorn_worker.UvicornWorker -w 1 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: OTP_EXPIRE_MINUTES
        value: "15"
      # Render gratis bloquea los puertos SMTP, así que se usa la API HTTPS de Brevo.
      - key: EMAIL_BACKEND
        value: brevo
      # Estos se completan a mano en el panel de Render (no se suben al repo).
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
